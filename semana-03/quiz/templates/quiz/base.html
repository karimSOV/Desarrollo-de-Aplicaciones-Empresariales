<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quiz{% endblock %}</title>
    <style>
        :root {
            --bg: #eef2f8;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --border: #e2e8f0;
            --text: #1f2937;
            --muted: #64748b;
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --primary-soft: #eef0ff;
            --success: #16a34a;
            --success-soft: #e8f7ee;
            --danger: #dc2626;
            --header-1: #0b1f3f;
            --header-2: #16294d;
            --radius: 14px;
            --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 16px rgba(15, 23, 42, 0.06);
            --shadow-hover: 0 6px 18px rgba(15, 23, 42, 0.14), 0 12px 40px rgba(15, 23, 42, 0.10);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(180deg, #eaf0fa 0%, var(--bg) 260px);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.15s ease;
        }

        a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        /* ---------- Header ---------- */

        header {
            background: linear-gradient(135deg, var(--header-1) 0%, var(--header-2) 100%);
            color: #ffffff;
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 4px 18px rgba(2, 8, 23, 0.35);
        }

        header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            padding-top: 0.85rem;
            padding-bottom: 0.85rem;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(90deg, #ffffff, #c7d2fe);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 1.75rem;
        }

        header nav a {
            position: relative;
            color: #cbd5e1;
            font-weight: 500;
            text-decoration: none;
            padding: 0.25rem 0;
            transition: color 0.2s ease;
        }

        header nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: -2px;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, #818cf8, #67e8f9);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.22s ease;
        }

        header nav a:hover,
        header nav a:focus {
            color: #ffffff;
            text-decoration: none;
        }

        header nav a:hover::after,
        header nav a:focus::after {
            transform: scaleX(1);
        }

        /* ---------- Main ---------- */

        main {
            flex: 1;
            padding: 1.75rem 0 2.5rem;
            width: 100%;
        }

        h2 {
            font-size: 1.65rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid var(--primary-soft);
            position: relative;
        }

        h2::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 64px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), #818cf8);
        }

        h3 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #334155;
            margin: 1.75rem 0 1rem;
        }

        .date-meta {
            color: var(--muted);
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
        }

        .exam-desc {
            color: #475569;
            margin-bottom: 0.5rem;
            white-space: pre-line;
        }

        /* ---------- Cards ---------- */

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* ---------- Exam list ---------- */

        .exam-grid {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: 1rem;
            margin-top: 1.25rem;
        }

        .exam-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 5px solid var(--primary);
            border-radius: var(--radius);
            padding: 1.1rem 1.25rem;
            box-shadow: var(--shadow);
            transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
        }

        .exam-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: #b9c2ef;
        }

        .exam-title {
            font-size: 1.08rem;
            font-weight: 600;
            color: #1e293b;
            display: block;
            text-decoration: none;
        }

        .exam-title:hover {
            color: var(--primary);
            text-decoration: none;
        }

        .exam-card .date-meta {
            margin: 0.25rem 0 0.5rem;
        }

        .exam-card .exam-desc {
            font-size: 0.92rem;
            margin: 0;
        }

        /* ---------- Exam detail ---------- */

        .question-list {
            display: grid;
            gap: 1.1rem;
        }

        .question-card {
            padding: 1.25rem 1.35rem;
            border-left: 5px solid #a5b4fc;
        }

        .question-text {
            font-size: 1.02rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.4rem;
        }

        .question-number {
            color: var(--primary);
            font-weight: 700;
            margin-right: 0.35rem;
        }

        .score-badge {
            display: inline-block;
            margin-left: 0.5rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: #574bd6;
            background: var(--primary-soft);
            border: 1px solid #d7dcfa;
            border-radius: 999px;
            padding: 0.1rem 0.55rem;
            vertical-align: middle;
        }

        .choice-list {
            list-style: none;
            display: grid;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .choice-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem 0.85rem;
            font-size: 0.95rem;
            color: #334155;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .choice-item:hover {
            border-color: #cbd5e1;
            background: #ffffff;
        }

        .choice-item.is-correct {
            background: var(--success-soft);
            border-color: #bbf7d0;
        }

        .correct-badge {
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--success);
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 999px;
            padding: 0.15rem 0.7rem;
        }

        /* ---------- Buttons ---------- */

        .btn {
            display: inline-block;
            font: inherit;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 0.6rem 1.25rem;
            cursor: pointer;
            transition: background 0.18s ease, color 0.18s ease,
                box-shadow 0.18s ease, transform 0.18s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.45);
            text-decoration: none;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #ffffff;
            color: #475569;
            border-color: var(--border);
        }

        .btn-secondary:hover {
            background: var(--surface-muted);
            color: #1e293b;
            border-color: #cbd5e1;
            text-decoration: none;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.9rem;
            margin-top: 1.5rem;
        }

        .actions .divider {
            color: var(--border);
        }

        /* ---------- Forms ---------- */

        .form-section {
            padding: 1.25rem 1.35rem;
            margin-bottom: 1.1rem;
        }

        .section-title {
            font-size: 1.02rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 0.9rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .section-title .hint {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--muted);
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.88rem;
            color: #475569;
            margin-bottom: 0.35rem;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            font: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem 0.8rem;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        input[type="checkbox"] {
            width: 1.15rem;
            height: 1.15rem;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            margin: 0;
            white-space: nowrap;
        }

        .checkbox-wrap input[type="checkbox"] {
            margin: 0;
        }

        /* ---------- Choice cards (formset) ---------- */

        .choice-card {
            border: 1px solid var(--border);
            border-left: 4px solid #a5b4fc;
            border-radius: 12px;
            background: var(--surface-muted);
            padding: 0.9rem 1rem;
            margin-bottom: 0.85rem;
        }

        .choice-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 0.6rem;
        }

        .choice-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .choice-body {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 1rem;
        }

        .choice-field {
            min-width: 0;
        }

        .choice-field .checkbox-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.55rem 0.8rem;
            font-size: 0.92rem;
        }

        .delete-wrap {
            margin-top: 0.6rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--danger);
            cursor: pointer;
        }

        .field-error {
            display: block;
            color: var(--danger);
            font-size: 0.82rem;
            font-weight: 500;
            margin-top: 0.35rem;
        }

        .alert {
            background: #fdf2f2;
            border: 1px solid #fecaca;
            border-left: 5px solid var(--danger);
            color: #991b1b;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.1rem;
        }

        .alert ul {
            list-style: none;
        }

        .alert p {
            margin-top: 0.25rem;
        }

        .empty-state {
            background: var(--surface);
            border: 1px dashed #cbd5e1;
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 1rem;
        }

        /* ---------- Footer ---------- */

        footer {
            text-align: center;
            color: #94a3b8;
            padding: 1.5rem 1rem;
            font-size: 0.85rem;
            margin-top: auto;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 640px) {
            header .container {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.35rem;
            }

            header nav {
                gap: 1.25rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            main {
                padding: 1.25rem 0 2rem;
            }

            .exam-grid {
                grid-template-columns: 1fr;
            }

            .choice-body {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
            }

            .actions .btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Quiz App</h1>
            <nav>
                <a href="{% url 'quiz:exam_list' %}">Exams</a>
                <a href="{% url 'admin:index' %}">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <p>Desarrollo de Aplicaciones Empresariales</p>
    </footer>
</body>
</html>
